name: predict
on:
  schedule:
    - cron: '*/10 23 * * *'
    - cron: '*/10 0-12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas lightgbm requests beautifulsoup4
      - run: python predict.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in model logs; do [ -d $d ] && git add -A $d; done
          if ! git diff --cached --quiet; then
            git commit -m "update"
            git pull --rebase
            git push
          fi
