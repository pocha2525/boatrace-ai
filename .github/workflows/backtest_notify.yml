name: backtest-notify
on:
  workflow_run:
    workflows: [backtest, refine]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '送信するbacktestの実行ID'
        required: true
permissions:
  contents: write
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      BACKTEST_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      BACKTEST_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'unknown' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send the verified diagnostic summary once
        run: python notify_evaluation.py
