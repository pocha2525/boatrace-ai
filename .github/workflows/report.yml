name: report
on:
  schedule:
    - cron: '7 23 * * *'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python report.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
