name: train
on:
  # Google Apps Script から10分ごとなどに起動する
  workflow_dispatch:
    inputs:
      auto:
        description: '自動実行なら1'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: repo-write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      GITHUB_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RELAY_URL: ${{ secrets.RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kdata-${{ github.run_id }}
          restore-keys: kdata-
      - run: pip install -r requirements.txt
      - run: python train.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: kdata-${{ github.run_id }}
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in model logs; do [ -d $d ] && git add -A $d; done
          if ! git diff --cached --quiet; then
            git commit -m "update"
            git pull --rebase
            git push
          fi
